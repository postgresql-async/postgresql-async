name: build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PGUSER: postgres
      PG_HOST: 127.0.0.1
      PGSSL_PORT: "5433"
      GITHUB_ACTIONS: true
    services:
      postgres:
        image: postgres:10
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}:/github/workspace
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:5.7
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-ssl:
        image: postgres:16
        ports:
          - 5433:5432
        volumes:
          - ${{ github.workspace }}/build/server:/custom:ro
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --entrypoint /custom/scripts/entrypoint-ci.sh
    strategy:
     matrix:
       scala: [2.12.20, 2.13.18, 3.3.7]
    timeout-minutes: 10
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: 'zulu'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Setup database
        run: |
          bash build/prepare_build.sh
          PGPORT=5433 bash build/prepare_pg.sh

      - name: Tests
        run: sbt ++${{matrix.scala}} test
        if: ${{ !startsWith(matrix.scala, '2.13') }}

      - name: Tests with Coverage
        run: sbt ++${{matrix.scala}} coverage test coverageAggregate
        if: ${{ startsWith(matrix.scala, '2.13') }}

      - name: Upload codecov
        if: ${{ startsWith(matrix.scala, '2.13') }}
        uses: codecov/codecov-action@v1
